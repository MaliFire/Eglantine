name: windows-pgo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mingw-pgo:
    name: windows-x86_64-pgo
    runs-on: windows-2022
    env:
      PLATFORM: windows-x86_64-pgo
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # refspec is the only value with no direct equivalent in the github context. Mirror how
      # prepare.sh would emit it: branches fetch into refs/remotes/origin/, tags into refs/tags/.
      - name: Compute refspec
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "refspec=+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "refspec=+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup build from checked-out source
        if: hashFiles('.github/actions/setup-build/action.yml') != ''
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ github.sha }}
          refspec: ${{ steps.ref.outputs.refspec }}
          tag: ${{ github.ref_name }}
          release: false

      - name: Setup build from compatibility pin
        if: hashFiles('.github/actions/setup-build/action.yml') == ''
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ github.sha }}
          refspec: ${{ steps.ref.outputs.refspec }}
          tag: ${{ github.ref_name }}
          release: false

      - name: Check PGO profile
        shell: bash
        run: |
          set -euo pipefail
          test -s eglantine.profdata

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DNIGHTLY_BUILD=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Package MinGW binary
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          # find the CLI by glob so it survives future renames
          cli=$(ls -1 ./*-cli.exe 2>/dev/null | head -n1 || true)
          if [ -z "$cli" ]; then
            echo "No *-cli.exe produced in build/release/bin:" >&2
            ls -la >&2
            exit 1
          fi
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          deps lichii.exe
          deps "$cli"
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      - name: Upload MinGW binary
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-windows-x86_64-pgo-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
